name: Publication quotidienne

on:
  schedule:
    # GitHub retarde (parfois de 3 h) ou saute les déclenchements programmés, surtout
    # à l'heure pile. On tente donc toutes les 30 min de 16h à 22h UTC, à des minutes
    # creuses : le script attend 18h à Paris et ne publie qu'une vidéo par jour.
    - cron: "7,37 16-21 * * *"
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai à blanc (ne publie rien)"
        type: boolean
        default: true
      forcer:
        description: "Dossier à publier tout de suite (vide = le suivant)"
        type: string
        default: ""
      plateformes:
        description: "Seulement ces plateformes (ex. instagram), vide = toutes"
        type: string
        default: ""
      miniature:
        description: "Refaire seulement la miniature YouTube de ce dossier"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # dernier registre, même si un autre passage vient de publier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q requests pillow
      - name: Publier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ESSAI: ${{ inputs.essai }}
          FORCER: ${{ inputs.forcer }}
          PLATEFORMES: ${{ inputs.plateformes }}
          MINIATURE: ${{ inputs.miniature }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--ignorer-heure"
            [ "$ESSAI" = "true" ] && ARGS="$ARGS --essai"
            [ -n "$FORCER" ] && ARGS="$ARGS --forcer $FORCER"
            [ -n "$PLATEFORMES" ] && ARGS="$ARGS --plateformes $PLATEFORMES"
            [ -n "$MINIATURE" ] && ARGS="--refaire-miniature $MINIATURE"
          fi
          python publication/publier.py $ARGS
      - name: Enregistrer le registre
        if: always()
        run: |
          git config user.name "anim-en-poche-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publication/publications.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Registre : publication du $(TZ=Europe/Paris date +%F)" && git push)
